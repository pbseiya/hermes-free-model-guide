<h2 id="step-4-%E0%B9%80%E0%B8%8A%E0%B8%B7%E0%B9%88%E0%B8%AD%E0%B8%A1-hermes-%E0%B8%81%E0%B8%B1%E0%B8%9A-okmd-api">Step 4: เชื่อม Hermes กับ OKMD API</h2>
<h3 id="%E0%B8%A7%E0%B8%B4%E0%B8%98%E0%B8%B5%E0%B8%97%E0%B8%B5%E0%B9%88-1-%E0%B9%83%E0%B8%AA%E0%B9%88%E0%B9%83%E0%B8%99%E0%B9%84%E0%B8%9F%E0%B8%A5%E0%B9%8C-env-%E0%B9%81%E0%B8%99%E0%B8%B0%E0%B8%99%E0%B8%B3">วิธีที่ 1: ใส่ในไฟล์ .env (แนะนำ)</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># แก้ไขไฟล์ .env</span>
nano ~/.hermes/.env

<span class="hljs-comment"># เพิ่มบรรทัดนี้</span>
OKMD_API_KEY=sk_YOUR_KEY_HERE
</code></pre>
<h3 id="%E0%B8%A7%E0%B8%B4%E0%B8%98%E0%B8%B5%E0%B8%97%E0%B8%B5%E0%B9%88-2-%E0%B9%83%E0%B8%8A%E0%B9%89%E0%B8%84%E0%B8%B3%E0%B8%AA%E0%B8%B1%E0%B9%88%E0%B8%87-hermes-env-set">วิธีที่ 2: ใช้คำสั่ง hermes env set</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">hermes <span class="hljs-built_in">env</span> <span class="hljs-built_in">set</span> OKMD_API_KEY sk_YOUR_KEY_HERE
</code></pre>
<h3 id="%E0%B8%A7%E0%B8%B4%E0%B8%98%E0%B8%B5%E0%B8%97%E0%B8%B5%E0%B9%88-3-%E0%B9%80%E0%B8%9E%E0%B8%B4%E0%B9%88%E0%B8%A1%E0%B8%9A%E0%B8%A3%E0%B8%A3%E0%B8%97%E0%B8%B1%E0%B8%94%E0%B8%94%E0%B9%89%E0%B8%A7%E0%B8%A2-echo">วิธีที่ 3: เพิ่มบรรทัดด้วย echo</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-built_in">echo</span> <span class="hljs-string">&quot;OKMD_API_KEY=sk_YOUR_KEY_HERE&quot;</span> &gt;&gt; ~/.hermes/.env
</code></pre>
<h3 id="%E0%B8%95%E0%B8%A3%E0%B8%A7%E0%B8%88%E0%B8%AA%E0%B8%AD%E0%B8%9A%E0%B8%A7%E0%B9%88%E0%B8%B2%E0%B9%83%E0%B8%AA%E0%B9%88%E0%B8%96%E0%B8%B9%E0%B8%81%E0%B8%95%E0%B9%89%E0%B8%AD%E0%B8%87">ตรวจสอบว่าใส่ถูกต้อง</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-built_in">cat</span> ~/.hermes/.env | grep OKMD_API_KEY
<span class="hljs-comment"># ควรเห็น: OKMD_API_KEY=sk_...</span>
</code></pre>
<h3 id="%E0%B8%A7%E0%B8%B4%E0%B8%98%E0%B8%B5%E0%B8%97%E0%B8%B5%E0%B9%88-2-%E0%B9%81%E0%B8%81%E0%B9%89-config-%E0%B9%80%E0%B8%AD%E0%B8%87">วิธีที่ 2: แก้ config เอง</h3>

<h1 id="%E2%9A%A0%EF%B8%8F-%E0%B8%9B%E0%B8%B1%E0%B8%8D%E0%B8%AB%E0%B8%B2-ssl-certificate"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> ปัญหา SSL Certificate</h1>
<p><strong>OKMD ใช้ self-signed certificate</strong> — Node.js จะปฏิเสธการเชื่อมต่อ</p>
<p><strong>วิธีแก้:</strong> เพิ่มใน <code>~/.hermes/.env</code>:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">NODE_TLS_REJECT_UNAUTHORIZED=0
</code></pre>
<p><strong>แก้ถาวร (macOS/Linux):</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-built_in">echo</span> <span class="hljs-string">&#x27;export NODE_TLS_REJECT_UNAUTHORIZED=0&#x27;</span> &gt;&gt; ~/.bashrc
</code></pre>
<p><strong>Windows (PowerShell):</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-powershell">[<span class="hljs-type">System.Environment</span>]::SetEnvironmentVariable(<span class="hljs-string">&#x27;NODE_TLS_REJECT_UNAUTHORIZED&#x27;</span>, <span class="hljs-string">&#x27;0&#x27;</span>, <span class="hljs-string">&#x27;User&#x27;</span>)
</code></pre>
<div class="warning">
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> ลดความปลอดภัยของ HTTPS ทั้งหมด — ใช้เฉพาะกับ OKMD</p>
</div>
<footer>ใช้ OKMD AI Playground — ฟรี 23 models สูงสุด 1M tokens/day</footer>
</section>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-yaml"><span class="hljs-attr">custom_providers:</span>

    <span class="hljs-attr">base_url:</span> <span class="hljs-string">https://gen.ai.kku.ac.th/okmd/api/v1</span>
    <span class="hljs-attr">key_env:</span> <span class="hljs-string">OKMD_API_KEY</span>

<span class="hljs-attr">model:</span>
  <span class="hljs-attr">default:</span> <span class="hljs-string">gpt-4o-mini</span>
  <span class="hljs-attr">provider:</span> <span class="hljs-string">custom:okmd</span>
</code></pre>

<h2 id="litellm-proxy-%E0%B9%81%E0%B8%99%E0%B8%B0%E0%B8%99%E0%B8%B3%E0%B8%AA%E0%B8%B3%E0%B8%AB%E0%B8%A3%E0%B8%B1%E0%B8%9A%E0%B8%AB%E0%B8%A5%E0%B8%B2%E0%B8%A2-providers">LiteLLM Proxy (แนะนำสำหรับหลาย Providers)</h2>
<h3 id="litellm-%E0%B8%84%E0%B8%B7%E0%B8%AD%E0%B8%AD%E0%B8%B0%E0%B9%84%E0%B8%A3">LiteLLM คืออะไร?</h3>
<p><strong>LiteLLM</strong> = OpenAI-compatible proxy ที่รวมหลาย providers:</p>
<ul>
<li>รองรับ 100+ models (OpenAI, Anthropic, Gemini, Bedrock, Azure)</li>
<li>Load balancing, fallback, retry อัตโนมัติ</li>
<li>Rate limit management</li>
<li>มี 2 รูปแบบ: <strong>Hosted</strong> (Cloud) และ <strong>Self-host</strong></li>
</ul>
<h3 id="litellm-%E0%B8%A1%E0%B8%B5-2-%E0%B8%A3%E0%B8%B9%E0%B8%9B%E0%B9%81%E0%B8%9A%E0%B8%9A">LiteLLM มี 2 รูปแบบ</h3>
<table>
<thead>
<tr>
<th>รูปแบบ</th>
<th>คำอธิบาย</th>
<th>เหมาะกับ</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Hosted</strong> (Cloud)</td>
<td>ใช้ proxy ที่คนอื่น host ให้</td>
<td>ผู้เรียน Course 0</td>
</tr>

<h3 id="troubleshooting-litellm">Troubleshooting LiteLLM</h3>
<p><strong>ปัญหา: &quot;Connection refused&quot;</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># สำหรับ Self-host: ตรวจสอบว่า LiteLLM ทำงานอยู่</span>
curl http://localhost:4000/health

<span class="hljs-comment"># สำหรับ Hosted: ตรวจสอบ internet connection</span>
curl https://litellm-proxy-gateway.pbseiyacpro7.workers.dev/health
</code></pre>
<p><strong>ปัญหา: &quot;Model not found&quot;</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># ดู models ที่มี</span>
curl http://localhost:4000/models

<span class="hljs-comment"># หรือสำหรับ Hosted</span>
curl https://litellm-proxy-gateway.pbseiyacpro7.workers.dev/models \
  -H <span class="hljs-string">&quot;Authorization: Bearer <span class="hljs-variable">$LITELLM_API_KEY</span>&quot;</span>
</code></pre>
<p><strong>ปัญหา: &quot;Invalid API key&quot;</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># ตรวจสอบ API key ใน .env</span>
<span class="hljs-built_in">cat</span> ~/.hermes/.env | grep LITELLM

<span class="hljs-comment"># ตั้ง API key ใหม่</span>
hermes <span class="hljs-built_in">env</span> <span class="hljs-built_in">set</span> LITELLM_API_KEY sk-correct-key
</code></pre>
<p><strong>ปัญหา: &quot;401 Unauthorized&quot; (Course 0)</strong></p>
<ul>
<li>ตรวจสอบว่าใช้ API Key ที่ instructor ให้มาถูกต้อง</li>
<li>API Key อาจหมดอายุ → ติดต่อ instructor</li>
<li>ตรวจสอบว่าไม่มีช่องว่างหรือ newline ใน key</li>
</ul>
<footer>ใช้ OKMD AI Playground — ฟรี 23 models สูงสุด 1M tokens/day</footer>

<h2 id="troubleshooting">Troubleshooting</h2>
<h3 id="%E0%B8%9B%E0%B8%B1%E0%B8%8D%E0%B8%AB%E0%B8%B2-hermes-setup-%E0%B9%84%E0%B8%A1%E0%B9%88%E0%B8%96%E0%B8%B2%E0%B8%A1-api-key-%E0%B8%AA%E0%B8%B3%E0%B8%AB%E0%B8%A3%E0%B8%B1%E0%B8%9A-custom-provider">ปัญหา: <code>hermes setup</code> ไม่ถาม API key สำหรับ custom provider</h3>
<p><strong>สาเหตุ:</strong> <code>hermes setup</code> เป็น wizard สำหรับ built-in providers เท่านั้น</p>
<p><strong>วิธีแก้:</strong></p>
<ul>
<li>ใช้ <code>hermes model</code> แทน (ถาม API key สำหรับ custom provider)</li>
<li>หรือแก้ <code>config.yaml</code> โดยตรง (วิธีที่ 2)</li>
</ul>
<h3 id="%E0%B8%9B%E0%B8%B1%E0%B8%8D%E0%B8%AB%E0%B8%B2-provider-not-found">ปัญหา: &quot;Provider not found&quot;</h3>
<p><strong>สาเหตุ:</strong> ใส่ชื่อ provider ผิด</p>
<p><strong>วิธีแก้:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># ดู providers ที่มี</span>
hermes config get custom_providers

<span class="hljs-comment"># ใช้ชื่อที่ถูกต้อง</span>
hermes config <span class="hljs-built_in">set</span> model.provider custom:okmd
</code></pre>
<h3 id="%E0%B8%9B%E0%B8%B1%E0%B8%8D%E0%B8%AB%E0%B8%B2-invalid-api-key">ปัญหา: &quot;Invalid API key&quot;</h3>
<p><strong>สาเหตุ:</strong> API key ผิด หรือไม่ได้ตั้งใน <code>.env</code></p>
<p><strong>วิธีแก้:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># ตรวจสอบ API key</span>
hermes <span class="hljs-built_in">env</span> show

<span class="hljs-comment"># ตั้ง API key ใหม่</span>
hermes <span class="hljs-built_in">env</span> <span class="hljs-built_in">set</span> OKMD_API_KEY sk_correct_key
</code></pre>
<footer>ใช้ OKMD AI Playground — ฟรี 23 models สูงสุด 1M tokens/day</footer>

<h2 id="step-6-%E0%B8%95%E0%B8%B1%E0%B9%89%E0%B8%87%E0%B8%84%E0%B9%88%E0%B8%B2-telegram-gateway">Step 6: ตั้งค่า Telegram Gateway</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># ตั้ง bot token</span>
hermes gateway setup
<span class="hljs-comment"># เลือก Telegram → วาง Bot Token</span>
</code></pre>
<h3 id="%E0%B8%AB%E0%B8%A3%E0%B8%B7%E0%B8%AD%E0%B9%81%E0%B8%81%E0%B9%89-env-%E0%B9%82%E0%B8%94%E0%B8%A2%E0%B8%95%E0%B8%A3%E0%B8%87">หรือแก้ .env โดยตรง</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># ~/.hermes/.env</span>
TELEGRAM_BOT_TOKEN=1234567890:ABCdefGHI...
TELEGRAM_ALLOWED_USERS=your_telegram_user_id
</code></pre>
<div class="info">
<p><strong>หา Telegram User ID:</strong></p>
<ol>
<li>เปิด Telegram → ค้นหา <code>@userinfobot</code></li>
<li>ส่ง <code>/start</code></li>
<li>Copy เลข ID ที่ได้ (เช่น <code>123456789</code>)</li>
</ol>
</div>
<h3 id="%E0%B9%80%E0%B8%A3%E0%B8%B4%E0%B9%88%E0%B8%A1-gateway">เริ่ม Gateway</h3>

<h2 id="%E0%B9%83%E0%B8%8A%E0%B9%89%E0%B8%87%E0%B8%B2%E0%B8%99%E0%B9%84%E0%B8%94%E0%B9%89%E0%B8%97%E0%B8%B1%E0%B8%99%E0%B8%97%E0%B8%B5%E0%B8%AB%E0%B8%A5%E0%B8%B1%E0%B8%87-reboot">ใช้งานได้ทันทีหลัง Reboot</h2>
<p>สคริปต์ติดตั้งจะตั้งค่า <strong>auto-start</strong> ให้ทั้ง 3 บริการ:</p>
<table>
<thead>
<tr>
<th>บริการ</th>
<th>วิธีเริ่ม</th>
<th>Auto-start หลัง Reboot</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Telegram Gateway</strong></td>
<td><code>hermes gateway start</code></td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> เปิดอัตโนมัติ</td>
</tr>
<tr>
<td><strong>Dashboard</strong></td>
<td><code>hermes dashboard</code></td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> เปิดอัตโนมัติ (<a href="http://localhost:3030">http://localhost:3030</a>)</td>
</tr>
<tr>
<td><strong>Desktop App</strong></td>
<td><code>hermes desktop</code></td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> เปิดอัตโนมัติ</td>
</tr>
</tbody>
</table>
<h3 id="%E0%B8%A7%E0%B8%B4%E0%B8%98%E0%B8%B5%E0%B8%81%E0%B8%B2%E0%B8%A3-auto-start-%E0%B8%95%E0%B8%B2%E0%B8%A1-os">วิธีการ Auto-start ตาม OS</h3>
<p><strong>Windows:</strong></p>
<ul>
<li>ใช้ <strong>Startup Folder</strong> (<code>shell:startup</code>)</li>
<li>สร้าง shortcut ทั้ง 3 services</li>
<li>จะเริ่มทำงานทันทีหลัง login</li>
</ul>
<p><strong>Linux (systemd):</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># ตรวจสอบสถานะ</span>
systemctl --user status hermes-gateway
systemctl --user status hermes-dashboard
systemctl --user status hermes-desktop

<span class="hljs-comment"># เริ่ม/หยุด services</span>
systemctl --user start hermes-gateway
systemctl --user start hermes-dashboard
systemctl --user start hermes-desktop
</code></pre>
<p><strong>macOS (launchd):</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># ตรวจสอบสถานะ</span>
launchctl list | grep hermes

<span class="hljs-comment"># Load services (ถ้ายังไม่ load)</span>
launchctl load ~/Library/LaunchAgents/com.hermes.gateway.plist
launchctl load ~/Library/LaunchAgents/com.hermes.dashboard.plist
launchctl load ~/Library/LaunchAgents/com.hermes.desktop.plist
</code></pre>

<h2 id="%E0%B8%82%E0%B8%B1%E0%B9%89%E0%B8%99%E0%B8%95%E0%B8%AD%E0%B8%99%E0%B8%AB%E0%B8%A5%E0%B8%B1%E0%B8%87%E0%B8%95%E0%B8%B4%E0%B8%94%E0%B8%95%E0%B8%B1%E0%B9%89%E0%B8%87">ขั้นตอนหลังติดตั้ง</h2>
<h3 id="%E0%B9%83%E0%B8%AA%E0%B9%88%E0%B8%84%E0%B9%88%E0%B8%B2%E0%B8%97%E0%B8%B5%E0%B8%AB%E0%B8%A5%E0%B8%B1%E0%B8%87-%E0%B8%96%E0%B9%89%E0%B8%B2%E0%B9%84%E0%B8%A1%E0%B9%88%E0%B9%84%E0%B8%94%E0%B9%89%E0%B9%83%E0%B8%AA%E0%B9%88%E0%B8%95%E0%B8%AD%E0%B8%99-install">ใส่ค่าทีหลัง (ถ้าไม่ได้ใส่ตอน install)</h3>
<div class="warning">
<p><strong><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> สำคัญ:</strong> <code>hermes setup</code> <strong>ไม่ถาม API key สำหรับ custom provider</strong> (OKMD เป็น custom provider)</p>
<p>ต้องใส่ API key ด้วยวิธีต่อไปนี้เท่านั้น:</p>
</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># 1. ใส่ OKMD API Key (เลือกวิธีใดวิธีหนึ่ง)</span>
<span class="hljs-comment"># วิธีที่ 1: แก้ไฟล์ .env โดยตรง</span>
nano ~/.hermes/.env
<span class="hljs-comment"># เพิ่ม: OKMD_API_KEY=sk_YOUR_KEY_HERE</span>

<span class="hljs-comment"># วิธีที่ 2: ใช้คำสั่ง</span>
hermes <span class="hljs-built_in">env</span> <span class="hljs-built_in">set</span> OKMD_API_KEY sk_YOUR_KEY_HERE

<span class="hljs-comment"># วิธีที่ 3: เพิ่มบรรทัดด้วย echo</span>
<span class="hljs-built_in">echo</span> <span class="hljs-string">&quot;OKMD_API_KEY=sk_YOUR_KEY_HERE&quot;</span> &gt;&gt; ~/.hermes/.env

<span class="hljs-comment"># 2. ตรวจสอบว่า API key ถูกใส่แล้ว</span>
<span class="hljs-built_in">cat</span> ~/.hermes/.env | grep OKMD_API_KEY

<span class="hljs-comment"># 3. เปลี่ยน model/provider (ถ้าต้องการ)</span>
hermes model

<span class="hljs-comment"># 4. ตรวจสอบว่าทำงานได้</span>
hermes doctor

<span class="hljs-comment"># 5. เริ่มใช้งาน</span>
hermes                    <span class="hljs-comment"># CLI chat</span>
hermes desktop            <span class="hljs-comment"># Desktop app</span>
hermes dashboard          <span class="hljs-comment"># Web dashboard (http://localhost:9119)</span>
