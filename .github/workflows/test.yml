name: Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml
        
    - name: Run installation tests
      run: |
        bash tests/test-install.sh
        
    - name: Run configuration tests
      run: |
        bash tests/test-config.sh
        
    - name: Validate Markdown links
      run: |
        # Check for broken markdown links
        find . -name "*.md" -type f | while read file; do
          echo "Checking $file..."
          grep -oP '\[([^\]]+)\]\(([^)]+)\)' "$file" | while read -r link; do
            url=$(echo "$link" | sed 's/.*](\(.*\))/\1/')
            if [[ $url =~ ^https?:// ]]; then
              echo "  External link: $url"
            elif [[ $url =~ ^\./ || $url =~ ^\.\./ ]]; then
              if [ ! -f "$(dirname "$file")/$url" ] && [ ! -d "$(dirname "$file")/$url" ]; then
                echo "  ⚠️  Broken relative link in $file: $url"
              fi
            fi
          done
        done
        
    - name: Check for secrets
      run: |
        echo "Checking for hardcoded secrets..."
        if grep -r "sk-.*[A-Za-z0-9]\{20,\}" . --exclude-dir=.git --exclude-dir=node_modules 2>/dev/null | grep -v "sk_YOUR_KEY_HERE" | grep -v "sk-proj-placeholder"; then
          echo "❌ Found potential hardcoded secrets!"
          exit 1
        else
          echo "✅ No hardcoded secrets found"
        fi
